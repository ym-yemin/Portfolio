<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title and page.title != 'Home' %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}" />
  <meta name="theme-color" content="#0b0f14" />
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
</head>
<body>
  <header class="site-header" id="siteHeader">
    <nav class="nav container" aria-label="Primary navigation">
      <a href="{{ '/' | relative_url }}#home" class="brand" aria-label="Ye Min — home">
        <span class="brand-mark">YM</span>
        <span>Ye Min</span>
      </a>

      <div class="nav-right">
        <div class="nav-links" id="navLinks">
          <a href="{{ '/' | relative_url }}#home">Home</a>
          <a href="{{ '/' | relative_url }}#about">About</a>
          <a href="{{ '/projects/' | relative_url }}">Projects</a>
          <a href="{{ '/' | relative_url }}#blog">Blog</a>
          <a href="{{ '/' | relative_url }}#contact">Contact</a>
        </div>

        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch theme">
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
          </svg>
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"></path>
          </svg>
        </button>

        <button class="menu-toggle" id="menuToggle" type="button" aria-label="Open menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M4 8h16M4 16h16"></path>
          </svg>
        </button>
      </div>
    </nav>
  </header>

  {{ content }}

  <footer>
    <div class="container footer-inner">
      <span>© <span id="year"></span> Ye Min.</span>
      <a href="{{ '/' | relative_url }}#home">Back to top ↑</a>
    </div>
  </footer>

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
